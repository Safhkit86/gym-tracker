# Serve la build statica di apps/web (React + react-router, client-side
# routing): senza il fallback qui sotto, un refresh su una rotta diversa
# dalla radice (es. /workouts) darebbe 404 invece di ricaricare l'app.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Header di sicurezza HTTP, applicati a ogni risposta di questo server
  # (ereditati dalla location sotto, che non li ridefinisce). Niente
  # Strict-Transport-Security: lo stack di "produzione locale" (vedi
  # README.md) serve ancora in chiaro su localhost, nessuna terminazione
  # TLS davanti a nginx — HSTS su una risposta HTTP non ha alcun effetto sui
  # browser, e andrebbe aggiunto solo quando un vero reverse proxy TLS
  # finirà davanti a questo container.
  #
  # script-src 'self' (nessun unsafe-inline/unsafe-eval): la build di Vite
  # non emette script inline (verificato sul dist/index.html prodotto), solo
  # <script type="module" src="/assets/...">. E' la riga che conta di più:
  # un XSS che provasse a eseguire JS arbitrario per leggere il token da
  # localStorage (vedi AuthProvider) verrebbe bloccato qui, a differenza di
  # uno stile iniettato (meno pericoloso: nessuna esecuzione di codice).
  #
  # style-src 'self' 'unsafe-inline': un paio di componenti (es. il tooltip
  # di IconButton, posizionato dinamicamente in base alla misura reale
  # dell'elemento) impostano uno style inline calcolato a runtime — la CSP
  # tratta uguale uno style scritto nell'HTML e uno assegnato via JS
  # (element.style.top = ...), quindi va permesso esplicitamente o quei
  # pochi style smetterebbero di applicarsi (non un errore bloccante, solo
  # un tooltip mal posizionato) — qui pesa molto meno di script-src: non
  # permette l'esecuzione di codice, solo l'iniezione di stili.
  #
  # connect-src: 'self' (per completezza, nessuna chiamata effettivamente
  # fatta verso l'origine di nginx stesso) + l'origine di api-gateway,
  # iniettata al build time dello stesso ARG VITE_API_BASE_URL già "cotto"
  # nel bundle JS (vedi apps/web/Dockerfile) — sostituita qui sotto da un
  # sed nello stage "runtime" del Dockerfile, placeholder lasciato
  # letterale se quel passo non viene eseguito (fallisce in modo rumoroso
  # bloccando il fetch, non silenziosamente permissivo).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
